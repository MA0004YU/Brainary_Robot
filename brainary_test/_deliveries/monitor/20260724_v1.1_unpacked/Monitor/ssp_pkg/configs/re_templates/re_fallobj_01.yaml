# RE-FALLOBJ-01: object fall (FALL split, intermediate, ADR-021). Intermediate outcome:
# an object dropped/toppled from an elevated support; downstream it can collide with a
# human, break (fragile), or crush a limb. Grounding (proposal §5): hazard on an
# elevated support, stability, robot pick/bump action.
id: RE-FALLOBJ-01
name: object_fall
event_role: intermediate_outcome
downstream_events: [collision_impact, fragile_breakage, pinch_crush_injury]
hazard_source:
  entity_type: physical_object
  subtypes: []
  required_attributes: {}
vulnerable_targets:
  - entity_type: physical_object
    subtypes: []
    required_attributes: {}
instantiation_conditions:
  - op: entity_type_in
    args: {field: hazard.type, values: [physical_object]}
  - op: relation_exists
    args: {relation: [supports], src: hazard, dst: hazard}
activation_conditions:
  - "supports(surface, hazard)"
  - "stability(hazard) in [unstable, tipping]"
# ADR-025: executable stability grounding, evaluated ONLY in scene_intrinsic mode.
# A stable object still instantiates (so pick/bump can activate object_fall) but
# is NOT an intrinsic (action-free) fall risk. Strict gate: unknown/None -> inactive
# (evidence insufficient), never fabricated as active.
intrinsic_activation_conditions:
  - op: entity_attr_in
    args: {entity: hazard, attr: stability, values: [unstable, tipping]}
propagation_edges:
  - from_role: hazard
    to_role: hazard
    relation: could_fall_from
    base_weight: 0.6
mitigation_relations:
  - relation: neutralized_by
    suppressor_filter:
      entity_type: surface
      subtypes: []
      required_attributes: {}
    mitigation_mode: hard
    residual_multiplier: 0.40
  - relation: isolated_by
    suppressor_filter:
      entity_type: physical_object
      subtypes: [container]
      required_attributes: {containment: locked}
    mitigation_mode: hard
    residual_multiplier: 0.10
action_activators:
  - action_type: pick
    target_role: hazard
    conditions: {}
  - action_type: bump
    target_role: hazard
    conditions: {}
  - action_type: push
    target_role: hazard
    conditions: {}
activation_rules:
  - action_type: pick
    participant_bindings: {target: hazard}
    conditions:
      - op: participant_is
        args: {role: target, matches: hazard}
    activation_strength: 0.8
  - action_type: bump
    participant_bindings: {target: hazard}
    conditions:
      - op: participant_is
        args: {role: target, matches: hazard}
    activation_strength: 1.0
  - action_type: push
    participant_bindings: {target: hazard}
    conditions:
      - op: participant_is
        args: {role: target, matches: hazard}
    activation_strength: 0.9
constraint_template_ids:
  - CT-STABLE-GRASP-ELEVATED
  - CT-CLEAR-PATH-BELOW
severity_default: 0.5
likelihood_prior: 0.4
