id: RE-SPILL-01
name: spill_damage
event_role: intermediate_outcome
downstream_events: [fall_injury, electrical_shock]
hazard_source:
  entity_type: physical_object
  subtypes: [container, hot_object]
  # ADR-029 fix: containment moved out of the (binary) identity filter so
  # containment=unknown -> unresolved candidate instead of a silent drop. The
  # three-state gate is in instantiation_conditions (entity_attr_in containment
  # in [open]).
  required_attributes: {}
vulnerable_targets:
  - entity_type: physical_object
    subtypes: [electronic, food_item]
    required_attributes: {}
  - entity_type: human
    subtypes: []
    required_attributes: {}
instantiation_conditions:
  - op: entity_type_in
    args: {field: hazard.subtype, values: [container, hot_object]}
  - op: entity_attr_in
    args: {entity: hazard, attr: containment, values: [open]}
  # ADR-028: require POSITIVE evidence the container holds some substance
  # (contains(hazard, <substance>)). No such edge -> no spill factor. This is
  # "no_observed_contents", NOT "empty_container": G_P cannot yet distinguish an
  # empty cup from an unknown one, so we neither fabricate a risk nor claim the
  # cup is confirmed empty. The known_empty/known_nonempty/unknown split (and a
  # matching uncertain candidate) is deferred to a v0.5 ADR.
  - op: relation_exists
    args:
      relation: [contains]
      src: hazard
      dst_type: substance
      # ADR-029: explicit observation binding for three-state contents. Has
      # contains(substance) -> met. No such edge: read hazard.contents_observation
      # -> complete = known empty (unmet, no factor); unknown/missing = undecidable
      # (unresolved -> uncertain candidate). Bound explicitly, not hard-coded.
      observation: {entity_role: hazard, field: contents_observation, complete_value: complete}
  - op: relation_exists
    args: {relation: [near, supports], src: hazard, dst: target}
activation_conditions:
  - "contains(hazard, liquid)"
  - "containment(hazard) == open"
  - "near(hazard, target)"
# ADR-027: scene-intrinsic gate consistent with fall/fragile (ADR-025). A static
# UPRIGHT open container does not spill on its own -> latent (a pick/push/pour/
# bump action, already in activation_rules, activates it). Only a tilted/inverted
# container is an active intrinsic spill. Strict gate: unknown/None -> uncertain.
intrinsic_activation_conditions:
  - op: entity_attr_in
    args: {entity: hazard, attr: orientation, values: [tilted, inverted]}
propagation_edges:
  - from_role: hazard
    to_role: target
    relation: could_spill_to
    base_weight: 0.6
mitigation_relations:
  - relation: isolated_by
    suppressor_filter:
      entity_type: physical_object
      subtypes: [container]
      required_attributes: {containment: sealed}
    mitigation_mode: hard
    residual_multiplier: 0.05
  - relation: neutralized_by
    suppressor_filter:
      entity_type: physical_object
      subtypes: [container]
      required_attributes: {orientation: upright}
    mitigation_mode: hard
    residual_multiplier: 0.50
action_activators:
  - action_type: pick
    target_role: hazard
    conditions: {}
  - action_type: push
    target_role: hazard
    conditions: {}
  - action_type: pour
    target_role: hazard
    conditions: {}
  - action_type: bump
    target_role: hazard
    conditions: {}
activation_rules:
  - action_type: pick
    participant_bindings: {target: hazard}
    conditions:
      - op: participant_is
        args: {role: target, matches: hazard}
    activation_strength: 0.9
  - action_type: push
    participant_bindings: {target: hazard}
    conditions:
      - op: participant_is
        args: {role: target, matches: hazard}
    activation_strength: 0.8
  - action_type: bump
    participant_bindings: {target: hazard}
    conditions:
      - op: participant_is
        args: {role: target, matches: hazard}
    activation_strength: 0.9
  - action_type: pour
    participant_bindings: {source: hazard}
    conditions:
      - op: participant_is
        args: {role: source, matches: hazard}
    activation_strength: 1.0
constraint_template_ids:
  - CT-UPRIGHT-GRASP
  - CT-CLEAR-PATH-LIQUID
severity_default: 0.6
likelihood_prior: 0.4
